<style>

</style></head><body><div id="ban"></div><div id="st"></div><main id="app"><p>Cargando…</p></main><nav id="nav"></nav>
<script>
// ───────── utilidades ─────────
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const TZ="America/Argentina/Mendoza",OFF="Sin conexión: no se pueden cargar movimientos",CLOSED="Ese día ya está cerrado: solo un ADMIN puede cargar o borrar movimientos";
const ARS=x=>new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS"}).format(+x||0);
const n=x=>Number.isFinite(+x)?+x:0,num=x=>x===""||x==null||typeof x=="boolean"?NaN:+String(x).replace(",","."),r2=x=>Math.round(n(x)*100)/100;
const today=(now=new Date())=>new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).format(now);
const addDays=(s,k)=>{const d=new Date(s+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+k);return d.toISOString().slice(0,10)};
const dow=s=>new Date(s+"T12:00:00Z").getUTCDay(),days=(a,b)=>Math.round((Date.parse(b+"T12:00:00Z")-Date.parse(a+"T12:00:00Z"))/864e5);
const isDate=s=>{try{return/^\d{4}-\d{2}-\d{2}$/.test(s||"")&&addDays(s,0)==s}catch(e){return false}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dmy=s=>esc(s?String(s).slice(0,10).split("-").reverse().join("/"):"");
const ago=ms=>{const s=Math.max(0,Math.round((Date.now()-ms)/1e3));return s<60?"hace instantes":s<3600?`hace ${Math.floor(s/60)} min`:s<86400?`hace ${Math.floor(s/3600)} h`:`hace ${Math.floor(s/86400)} d`};
const uuid=()=>crypto.randomUUID();
const KINDS=["ventas","gastos","retiros","viajes","aperturas","cierres","productos","futuros","config","compras","inventario","ajustes","revisiones"];
const DATED=new Set(["ventas","gastos","retiros","viajes","aperturas","cierres","futuros","compras","ajustes","revisiones"]);
const MOVS=["ventas","gastos","retiros","compras","viajes"],ADMK=new Set(["productos","config","inventario","futuros","revisiones","aperturas","cierres"]);
let P=[],sb,db,me,myMail="",admin=false,tab="inicio",ro=false,rt=false,joined=false,lastSync=0,pending=false,loading=false,again=false,ch=null,ver=0,per={p:"mes",from:"",to:""},expDs="todos",D={};
const drafts={};KINDS.forEach(k=>D[k]=[]);
const TABS=[["inicio","Inicio"],["venta","Venta"],["gasto","Gasto"],["caja","Caja"],["compra","Compras"],["stock","Stock"],["retiro","Retiro"],["comb","Combustible"],["proy","Proyección"],["rep","Reportes"],["cfg","Config"],["out","Salir"]];
// ───────── validez de registros (lo inválido se ignora en los cálculos y se avisa) ─────────
const OK={ventas:x=>n(x.total)>0&&Array.isArray(x.items)&&x.items.length>0&&x.items.every(i=>n(i.qty)>0&&n(i.price)>0)&&Math.abs(saleTotal(x.items)-n(x.total))<0.01,
 gastos:x=>n(x.amount)>0&&(x.type=="DIRECT"||x.type=="INDIRECT")&&(!x.estimated||!x.trip||D.viajes.some(v=>v.id==x.trip&&!v.deleted)),
 retiros:x=>n(x.amount)>0,compras:x=>n(x.amount)>0&&n(x.qty)>0,futuros:x=>n(x.amount)>0,aperturas:x=>Number.isFinite(num(x.open))&&x.open>=0,
 cierres:x=>Number.isFinite(num(x.counted))&&x.counted>=0,viajes:x=>n(x.km)>0&&n(x.cost)>=0,productos:x=>n(x.price)>0,ajustes:x=>n(x.delta)!==0};
const LC={},touch=()=>ver++;
const live=k=>{const c=LC[k];if(c&&c.v==ver&&c.a===D[k]&&c.l==D[k].length&&c.va===D.viajes&&c.vl==D.viajes.length)return c.r.slice();
 const r=D[k].filter(x=>!x.deleted&&(!DATED.has(k)||isDate(x.date))&&(!OK[k]||OK[k](x)));LC[k]={v:ver,a:D[k],l:D[k].length,va:D.viajes,vl:D.viajes.length,r};return r.slice()};
const cfg=()=>Object.assign({medios:["EFECTIVO","TRANSFERENCIA","TARJETA","QR"],cats:["Insumos","Alquiler","Servicios","Mantenimiento","Otros"],consumo:0,precio:0,capital:0},(live("config").find(x=>x.id=="main")||{}));
const medios=()=>cfg().medios.filter(m=>m&&m!="ESTIMADO");
const real=()=>live("gastos").filter(g=>!g.estimated);
const sum=(a,f=x=>x.amount)=>a.reduce((s,x)=>s+n(f(x)),0);
const cash=a=>a.filter(x=>x.medio=="EFECTIVO");
const canDel=(k,x)=>{if(typeof k=="object"){x=k;k=""}if(ro||!x)return false;if(admin)return true;if(ADMK.has(k))return false;return x.created_by==me&&x.date==today()&&!closed(x.date)};
// ───────── cálculos puros (testeables) ─────────
function saleTotal(items){return r2(sum(items,i=>n(i.qty)*n(i.price)))}
function expectedCash(open,ventas,gastos,retiros,otrosIn=0,otrosOut=0){return r2(n(open)+sum(cash(ventas),v=>v.total)+otrosIn-sum(cash(gastos))-sum(cash(retiros))-otrosOut)}
function fuel(ini,dest,ret,cons,precio){const km=Math.round((ret-ini)*1e3)/1e3,l=Math.round(km*cons*1e3)/1e3;return{kmIda:dest-ini,kmVuelta:ret-dest,km,l,cost:r2(km*cons*precio)}}
function operating(ventas,gastos){return r2(sum(ventas,v=>v.total)-sum(gastos.filter(g=>g.type=="DIRECT"))-sum(gastos.filter(g=>g.type=="INDIRECT")))}
function result(v,g){const dir=sum(g.filter(x=>x.type=="DIRECT")),ind=sum(g.filter(x=>x.type=="INDIRECT"));return{ing:sum(v,x=>x.total),dir,ind,comb:sum(g.filter(x=>x.estimated)),res:operating(v,g)}}
// agregados por día, recalculados solo cuando cambian los datos (evita recorrer todo en cada arqueo)
const memo=f=>{let k=null,v;return()=>{const key=[ver,D.aperturas,D.viajes,...MOVS.map(m=>D[m]),...MOVS.map(m=>D[m].length)];if(k&&key.every((x,i)=>x===k[i]))return v;k=key;return v=f()}};
const dayAgg=memo(()=>{const m={},add=(d,i,o)=>{const x=m[d]=m[d]||{i:0,o:0};x.i+=i;x.o+=o};cash(live("ventas")).forEach(v=>add(v.date,n(v.total),0));["gastos","compras","retiros"].forEach(k=>cash(live(k)).forEach(x=>add(x.date,0,n(x.amount))));return m});
const maxUpd=memo(()=>{const m={};MOVS.forEach(k=>D[k].forEach(x=>{const t=Date.parse(x.updated_at||"")||0;if(t>(m[x.date]||0))m[x.date]=t}));return m});
// efectivo esperado del día = apertura + ventas EFECTIVO − gastos, compras y retiros EFECTIVO (mismo cálculo que expected_cash() en la base)
function dayExp(d){const ap=live("aperturas").find(a=>a.date==d);if(!ap)return null;const a=dayAgg()[d]||{i:0,o:0};return r2(n(ap.open)+a.i-a.o)}
function saldo(){return r2(n(cfg().capital)+sum(live("ventas"),v=>v.total)-sum(real())-sum(live("retiros"))-sum(live("compras")))}
const closed=d=>live("cierres").some(c=>c.date==d);
const eff=c=>c.expected_rev??c.expected;
const refT=c=>Date.parse(c.revised_at||c.closed_at||c.created_at||"")||0;
// un movimiento de ese día cambió (alta, baja o edición) después del cierre o del último recálculo
const changedAfter=c=>{const t=refT(c);return t>0&&(maxUpd()[c.date]||0)>t};
const st=c=>c.review===true||changedAfter(c)||Math.abs((dayExp(c.date)??0)-n(eff(c)))>=0.005?"REQUIERE REVISIÓN":"OK";
const stockOf=i=>r2(n(i.stock0)+sum(live("compras").filter(c=>c.item==i.id),c=>c.qty)+sum(live("ajustes").filter(a=>a.item==i.id),a=>a.delta));
const lastDom=s=>+addDays(addDays(s.slice(0,8)+"01",32).slice(0,8)+"01",-1).slice(8);
function occurs(f,d){if(d<f.date)return false;if(f.freq=="WEEKLY")return days(f.date,d)%7==0;if(f.freq=="MONTHLY")return+d.slice(8)==Math.min(+f.date.slice(8),lastDom(d));return d==f.date}
function nextOcc(f,from){for(let i=0,d=from>f.date?from:f.date;i<62;i++,d=addDays(d,1))if(occurs(f,d))return d;return null}
function badDate(s,future=false){if(!isDate(s))return"Fecha inválida";if(s<"2020-01-01")return"Fecha inválida";if(!future&&s>today())return"La fecha no puede ser futura";return""}
// ───────── proyección ─────────
function hist(t=today()){const d={};live("ventas").filter(v=>v.date<t).forEach(v=>d[v.date]=(d[v.date]||0)+n(v.total));const by={};
 Object.entries(d).forEach(([k,x])=>{const w=dow(k);by[w]=by[w]||{s:0,n:0};by[w].s+=x;by[w].n++});const nd=Object.keys(d).length;
 return{ok:nd>=7,n:nd,by,fuelDay:nd?sum(live("viajes").filter(v=>v.date<t),v=>v.cost)/nd:0}}
function proj(weeks=4){const h=hist(),t=today(),F=live("futuros");let s=saldo();const out=[];
 for(let w=0;w<weeks;w++){const from=addDays(t,7*w),to=addDays(from,6),L={GASTO:0,COMPRA:0,SUELDO:0,RETIRO:0,INGRESO:0};let inc=0,comb=0;
  for(let i=0;i<7;i++){const d=addDays(from,i);
   if(h.ok&&d>t){const q=h.by[dow(d)];if(q){inc+=q.s/q.n;comb+=h.fuelDay}}   // hoy no se proyecta: sus ventas reales ya están cargadas
   F.forEach(f=>{if(occurs(f,d))L[L[f.kind]!==undefined?f.kind:"GASTO"]+=n(f.amount)})}
  inc=r2(inc+L.INGRESO);comb=r2(comb);const oper=r2(L.GASTO+L.COMPRA+L.SUELDO+comb),so=r2(s+inc-oper),sf=r2(so-L.RETIRO);
  out.push({from,to,ini:s,inc,compras:L.COMPRA,gastos:L.GASTO,sueldos:L.SUELDO,comb,oper,ret:L.RETIRO,so,saldo:sf});s=sf}
 return out}
// ───────── datos ─────────
async function claim(col,id,data){const ref=db.collection(col).doc(id),l=await ref.acquire({holder:me,ttlMs:5000});if(!l.acquired)return false;const x=await ref.get();if(x.exists&&x.data()&&x.data().date)return false;try{await ref.set(data)}catch(e){if(e.code=="23505")return false;throw e}return true}
const RCP=/^[0-9a-f-]{36}\/[0-9a-f-]{36}\.(jpg|png|pdf)$/;
async function up(f){if(!f||!f.size)return"";if(!["image/jpeg","image/png","application/pdf"].includes(f.type))throw new Error("Comprobante: solo JPG, PNG o PDF");if(f.size>5e6)throw new Error("Comprobante: máximo 5 MB");
 const p=me+"/"+uuid()+"."+f.type.split("/")[1].replace("jpeg","jpg");const{error}=await sb.storage.from("comprobantes").upload(p,f,{contentType:f.type});if(error)throw new Error("No se pudo subir el comprobante: "+msgOf(error));return p}
// comprobantes: bucket privado → solo URL firmada de corta duración y con sesión activa
async function receiptUrl(p){if(!RCP.test(p||""))throw new Error("Comprobante inválido");const{data}=await sb.auth.getSession();if(!data||!data.session)throw new Error("Iniciá sesión para ver comprobantes");
 const r=await sb.storage.from("comprobantes").createSignedUrl(p,60);if(r.error||!r.data||!r.data.signedUrl)throw new Error("No se pudo abrir el comprobante");return r.data.signedUrl}
function stamp(k,obj){const id=obj.id||uuid(),t=new Date().toISOString(),prev=D[k].find(x=>x.id==id);const o={...obj,id,updated_at:t,updated_by:me};
 if(!prev){o.created_at=t;o.created_by=me}else{o.created_at=prev.created_at;o.created_by=prev.created_by}return o}
async function save(k,obj){const o=stamp(k,obj);await db.collection(k).doc(o.id).set(o);return o.id}
async function saveMany(list){const L=list.map(([k,o])=>[k,stamp(k,o)]);if(db.batch)await db.batch(L);else for(const[k,o]of L)await db.collection(k).doc(o.id).set(o)}   // batch = un solo INSERT (atómico)
const del=async(k,id)=>{if(confirm("¿Eliminar este registro? Queda anulado en el historial.")){await db.collection(k).doc(id).update({deleted:true,updated_at:new Date().toISOString(),updated_by:me});return true}return false};
async function recalc(d){const c=live("cierres").find(x=>x.date==d),e=dayExp(d);if(!admin||!c||e==null)return false;
 if(!confirm(`Recalcular arqueo del ${dmy(d)}: esperado ${ARS(eff(c))} → ${ARS(e)}. Queda registrado.`))return false;
 await db.collection("cierres").doc(d).update({recalc:true,expected_rev:e,diff:r2(n(c.counted)-e),review:false,revised_at:new Date().toISOString(),revised_by:me});return true}
const fd=f=>{const o={};for(const el of f.elements||[]){if(!el.name||el.disabled)continue;if(el.type=="file")o[el.name]=el.files&&el.files[0];else if(el.type=="checkbox")o[el.name]=el.checked;else if(el.type=="radio"){if(el.checked)o[el.name]=el.value}else o[el.name]=el.value}return o};
// ───────── piezas de interfaz ─────────
const sel=(nm,a,cur)=>`<select name="${esc(nm)}">${a.map(x=>{const[v,l]=Array.isArray(x)?x:[x,x];return`<option value="${esc(v)}"${v==cur?" selected":""}>${esc(l)}</option>`}).join("")}</select>`;
const chips=(nm,a,cur,cls="")=>`<div class="chips" role="radiogroup">${a.map(x=>{const[v,l]=Array.isArray(x)?x:[x,x];return`<label><input type="radio" class="${cls}" name="${esc(nm)}" value="${esc(v)}"${v==cur?" checked":""} required><span>${esc(l)}</span></label>`}).join("")}</div>`;
const kc=(l,v,c="")=>`<div class="card">${l}<div class="k ${c}">${v}</div></div>`;
const byDesc=(a,b)=>(b.date||"").localeCompare(a.date||"")||String(b.created_at||"").localeCompare(String(a.created_at||""));
const list=(k,fn,lim=30)=>live(k).sort(byDesc).slice(0,lim).map(x=>`<div class="row"><span>${dmy(x.date)} ${fn(x)}</span><span class="acts">${x.receipt?`<button type="button" class="x t" data-rcp="${esc(x.receipt)}" aria-label="Ver comprobante">📎</button>`:""}${canDel(k,x)?`<button type="button" class="x" data-del="${esc(k)}:${esc(x.id)}" aria-label="Eliminar">✕</button>`:""}</span></div>`).join("")||'<p class="m">Sin registros.</p>';
const dateIn=(v,future)=>`<label class="m">Fecha</label><input name="date" type="date" value="${esc(v)}"${future?"":` max="${today()}"`} required>`;
function alerts(p){const t=today();let al="";const rv=live("cierres").filter(c=>st(c)!="OK").sort(byDesc);
 rv.slice(0,5).forEach(c=>al+=`<div class="al">Arqueo ${dmy(c.date)}: REQUIERE REVISIÓN${admin?" (recalcular en Caja)":""}</div>`);if(rv.length>5)al+=`<div class="al">${rv.length-5} arqueo(s) más a revisar</div>`;
 live("cierres").filter(c=>c.date>=addDays(t,-7)&&Math.abs(n(c.counted)-n(eff(c)))>=0.01).forEach(c=>al+=`<div class="al">Diferencia de caja ${dmy(c.date)}: ${ARS(n(c.counted)-n(eff(c)))}</div>`);
 live("aperturas").filter(a=>a.date<t&&!closed(a.date)).forEach(a=>al+=`<div class="al">Caja del ${dmy(a.date)} abierta sin cerrar</div>`);
 live("inventario").filter(i=>stockOf(i)<=n(i.min)).forEach(i=>al+=`<div class="al">Stock bajo: ${esc(i.name)} (${stockOf(i)} ${esc(i.unit)})</div>`);
 const w=p.find(w=>w.saldo<0);if(w)al+=`<div class="al">Faltante de fondos proyectado semana del ${dmy(w.from)}: ${ARS(-w.saldo)}</div>`;
 const bad=KINDS.reduce((s,k)=>s+D[k].filter(x=>!x.deleted).length-live(k).length,0);if(bad)al+=`<div class="al">${bad} registro(s) inválido(s) ignorados en los cálculos</div>`;return al}
// ───────── vistas ─────────
const V={
inicio(){const t=today(),mes=t.slice(0,7),vt=live("ventas").filter(v=>v.date==t),gt=live("gastos").filter(g=>g.date==t),ap=live("aperturas").find(a=>a.date==t),ci=live("cierres").find(c=>c.date==t),exp=dayExp(t);
 const vm=live("ventas").filter(v=>v.date.startsWith(mes)),gm=live("gastos").filter(g=>g.date.startsWith(mes)),oh=operating(vt,gt),om=operating(vm,gm),p=proj(),w=p[0];
 const prox=live("futuros").map(f=>({...f,next:nextOcc(f,t)})).filter(f=>f.next&&f.next<=addDays(t,14)&&f.kind!="INGRESO").sort((a,b)=>a.next.localeCompare(b.next)),comb=sum(gt.filter(g=>g.estimated));
 return`<div class="quick"><button class="p" data-t="venta">+ Venta</button><button class="p" data-t="gasto">+ Gasto</button></div>${alerts(p)}<div class="grid">

 case"compras":return{cols:C("Fecha:d","Ítem:s","Cantidad:n","Unidad:s","Concepto:s","Proveedor:s","Categoría:s","Medio:s","Importe:n"),rows:live("compras").filter(f).sort(byAsc).map(c=>{const i=D.inventario.find(x=>x.id==c.item)||{};return[c.date,i.name||"",n(c.qty),i.unit||"",c.desc||"",c.supplier||"",c.cat||"",c.medio,n(c.amount)]})};

 case"combustible":return{cols:C("Fecha:d","Km inicio:n","Km destino:n","Km vuelta:n","Km total:n","Litros:n","Consumo (l/km):n","Precio ($/l):n","Costo estimado:n"),rows:live("viajes").filter(f).sort(byAsc).map(v=>[v.date,n(v.ini),n(v.dest),n(v.ret),n(v.km),n(v.l),n(v.consumo),n(v.precio),n(v.cost)])};

const csvCell=(v,t)=>{if(v===""||v==null)return"";if(t=="d")return String(v).slice(0,10).split("-").reverse().join("/");if(t=="n")return String(Math.round(n(v)*1000)/1000).replace(".",",");let s=String(v);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return`"${s.replace(/"/g,'""')}"`};

async function handle(id,d){const t=today(),c=cfg();

 case"fr":{if(!(d.person||"").trim())return"Falta la persona";await save("retiros",{date:d.date,person:d.person.trim(),amount:r2(num(d.amount)),medio:d.medio});break}
 case"fcmp":{if(!(num(d.qty)>0))return"La cantidad debe ser mayor a 0";if(!live("inventario").some(i=>i.id==d.item))return"Ítem inválido";if(!(d.desc||"").trim())return"Falta el concepto";const receipt=await up(d.file);
  await save("compras",{date:d.date,item:d.item,qty:num(d.qty),amount:r2(num(d.amount)),desc:d.desc.trim(),supplier:(d.supplier||"").trim(),cat:d.cat||"",medio:d.medio,notes:(d.notes||"").trim(),receipt});break}
 case"fa":{if(!(num(d.open)>=0))return"Efectivo inicial inválido";if(!await claim("aperturas",t,{id:t,date:t,open:r2(num(d.open))}))return"La caja de hoy ya fue abierta";break}
 case"fc":{const e=dayExp(t);if(e==null)return"Primero abrí la caja";if(!(num(d.counted)>=0))return"Efectivo contado inválido";const k=r2(num(d.counted));
  if(!await claim("cierres",t,{id:t,date:t,expected:e,counted:k,diff:r2(k-e),notes:(d.notes||"").trim(),closed_at:new Date().toISOString()}))return"El día ya fue cerrado";break}
 case"ff":{if(!(n(c.consumo)>0&&n(c.precio)>0))return"Un ADMIN debe configurar consumo y precio";const[a,b,v]=[num(d.ini),num(d.dest),num(d.ret)];if(![a,b,v].every(Number.isFinite)||a<0)return"Kilometraje inválido";
  const r=fuel(a,b,v,n(c.consumo),n(c.precio));if(r.km<=0||r.kmIda<0||r.kmVuelta<0)return"Kilometraje inválido: inicio ≤ destino ≤ vuelta";const tid=uuid();
  await saveMany([["viajes",{id:tid,date:d.date,ini:a,dest:b,ret:v,km:r.km,l:r.l,cost:r.cost,consumo:n(c.consumo),precio:n(c.precio)}],["gastos",{id:"comb-"+tid,trip:tid,date:d.date,type:"INDIRECT",cat:"Combustible",desc:"Combustible estimado",amount:r.cost,medio:"ESTIMADO",estimated:true}]]);break}
 case"fi":{if(!(d.name||"").trim()||!(d.unit||"").trim())return"Completá nombre y unidad";if(!(num(d.stock0)>=0&&num(d.min)>=0))return"Stock inicial y mínimo deben ser 0 o más";
  await save("inventario",{name:d.name.trim(),unit:d.unit.trim(),stock0:num(d.stock0),min:num(d.min),cost:n(num(d.cost)),supplier:(d.supplier||"").trim()});break}
 case"fp":{const e=badDate(d.date,true);if(e)return e;if(!(num(d.amount)>0))return"El importe debe ser mayor a 0";if(!(d.desc||"").trim())return"Falta la descripción";await save("futuros",{date:d.date,desc:d.desc.trim(),amount:r2(num(d.amount)),kind:d.kind||"GASTO",freq:d.freq||"ONCE"});break}
 case"fcfg":{const[co,pr,ca]=[num(d.consumo),num(d.precio),num(d.capital===""?0:d.capital)];if(!(co>=0&&pr>=0&&ca>=0))return"Valores inválidos: deben ser números de 0 o más";
  await db.collection("config").doc("main").set({id:"main",capital:ca,consumo:co,precio:pr,medios:[...new Set(["EFECTIVO",...String(d.medios||"").split(",").map(s=>s.trim().toUpperCase()).filter(x=>x&&x!="ESTIMADO")])],cats:[...new Set(String(d.cats||"").split(",").map(s=>s.trim()).filter(Boolean))],updated_by:me});break}
 case"fprod":{if(!(d.name||"").trim())return"Falta el nombre";if(!(num(d.price)>0))return"El precio debe ser mayor a 0";await save("productos",{name:d.name.trim(),price:r2(num(d.price)),active:true});break}

  if((ds.role||ds.act)&&admin){const u=P.find(x=>x.id==(ds.role||ds.act));if(!u||u.id==me)return alert("No podés cambiar tu propio usuario");

 }catch(x){alert(msgOf(x))}}

function msgOf(e){const m=String(e&&e.message||e||""),c=e&&e.code;
 if(c=="42501"||c=="not_granted"||/row-level security|permission denied/i.test(m))return"No tenés permiso para esta acción";
 if(c=="23505"||/duplicate key/i.test(m))return"Ese registro ya existe (otro usuario lo cargó primero)";
 if(/Failed to fetch|NetworkError|Load failed|network|fetch failed|timeout/i.test(m))return"Sin conexión: no se pudo completar. Revisá la conexión e intentá de nuevo.";
 if(/JWT|token/i.test(m))return"Tu sesión venció: salí y volvé a ingresar";return m||"No se pudo guardar"}
const isNet=e=>/Sin conexión/.test(msgOf(e));
const err=e=>{const x=new Error(msgOf(e));x.code=e.code=="42501"?"not_granted":e.code;return x};
const META=["id","created_at","created_by","updated_at","updated_by","deleted","review_local"];
const REC=r=>({...(r.data||{}),id:r.id,date:r.date??(r.data||{}).date??null,deleted:!!r.deleted,created_by:r.created_by,created_at:r.created_at,updated_at:r.updated_at,updated_by:r.updated_by});
const toRow=(k,id,o)=>{const data={...o};META.forEach(m=>delete data[m]);return{kind:k,id,date:o.date||null,data,deleted:!!o.deleted}};
function put(r){if(!r||!D[r.kind])return;const x=REC(r),a=D[r.kind].slice(),i=a.findIndex(y=>y.id==x.id);if(i<0)a.push(x);else a[i]=x;D[r.kind]=a;touch()}
const mkRef=(k,id)=>({strict:false,async acquire(){this.strict=true;return{acquired:true}},   // la unicidad real la da la clave primaria (kind,id)
 async get(){const{data,error}=await sb.from("records").select("*").eq("kind",k).eq("id",id).maybeSingle();if(error)throw err(error);return{exists:!!data,data:()=>data&&REC(data)}},
 async set(o){const row=toRow(k,id,o),q=this.strict?sb.from("records").insert(row):sb.from("records").upsert(row,{onConflict:"kind,id"});const{data,error}=await q.select().single();if(error)throw err(error);put(data)},
 async update(p){const q={},dp={...p};META.forEach(m=>delete dp[m]);if("deleted"in p)q.deleted=!!p.deleted;
  if(Object.keys(dp).length){const{data:c,error:e1}=await sb.from("records").select("*").eq("kind",k).eq("id",id).single();if(e1)throw err(e1);q.data={...c.data,...dp}}
  const{data,error}=await sb.from("records").update(q).eq("kind",k).eq("id",id).select().single();if(error)throw err(error);put(data)}});
const sdb={collection:k=>({doc:id=>mkRef(k,id)}),async batch(L){const{data,error}=await sb.from("records").insert(L.map(([k,o])=>toRow(k,o.id,o))).select();if(error)throw err(error);(data||[]).forEach(put)}};
